<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Recovery</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#00c853,#ffffff);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    background:white;
    width:350px;
    padding:25px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

h1{
    color:#00c853;
}

p{
    color:#555;
}

button{
    background:#00c853;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:30px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#009624;
}

#result{
    margin-top:20px;
    color:#222;
}
</style>
</head>

<body>

<div class="card">
    <h1>Image Recovery</h1>
    <p>Recover your deleted images quickly.</p>

    <button onclick="getLocation()">
        Recover Now
    </button>

    <p id="result"></p>
</div>

<script>
function getLocation(){
    document.getElementById("result").innerHTML =
    "Recovery started...";
}
</script>

</body>
</html>
